<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="screen">
    <!-- Status bar -->
    <div class="status-bar">
      <span class="status-bar__time">9:41</span>
      <div class="status-bar__icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><rect x="0" y="7" width="3" height="5" rx="1" fill="white"/><rect x="5" y="5" width="3" height="7" rx="1" fill="white"/><rect x="10" y="3" width="3" height="9" rx="1" fill="white"/><rect x="15" y="0" width="3" height="12" rx="1" fill="white"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 10a1.3 1.3 0 100 2.6A1.3 1.3 0 008 10zM4.6 7.4a5 5 0 016.8 0l-1.3 1.4a3 3 0 00-4.2 0L4.6 7.4zM2 4.8a9 9 0 0112 0L12.7 6.2a7 7 0 00-9.4 0L2 4.8z" fill="white"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="white"/><rect x="2" y="2" width="16" height="8" rx="1.5" fill="white"/><rect x="23" y="4" width="1.5" height="4" rx="0.75" fill="white"/></svg>
      </div>
    </div>

    <!-- Tab / back button -->
    <div class="tab">
      <button class="icon-btn" aria-label="Volver">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <!-- Content -->
    <div class="content">
      <div class="avatar">
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <path d="M18 19.5C22.1421 19.5 25.5 16.1421 25.5 12C25.5 7.85786 22.1421 4.5 18 4.5C13.8579 4.5 10.5 7.85786 10.5 12C10.5 16.1421 13.8579 19.5 18 19.5Z" fill="#BF7DEA" stroke="#BF7DEA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M30 31.5C30 28.3174 28.7357 25.2652 26.4853 23.0147C24.2348 20.7643 21.1826 19.5 18 19.5C14.8174 19.5 11.7652 20.7643 9.51472 23.0147C7.26428 25.2652 6 28.3174 6 31.5" stroke="#BF7DEA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M18 19.5C14.8174 19.5 11.7652 20.7643 9.51472 23.0147C7.26428 25.2652 6 28.3174 6 31.5H30C30 28.3174 28.7357 25.2652 26.4853 23.0147C24.2348 20.7643 21.1826 19.5 18 19.5Z" fill="#BF7DEA" stroke="#BF7DEA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
      </div>

      <div class="heading">
        <h1>Iniciar sesión</h1>
        <p>Ingresa los datos para iniciar sesión</p>
      </div>

      <form class="form" id="login-form">
        <div class="field">
          <label for="email">Correo electrónico<span class="required">*</span></label>
          <input type="email" id="email" name="email" value="libermangonzalez@gmail.com" />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" value="12345678" />
            <button type="button" class="icon-btn" id="toggle-password" aria-label="Mostrar contraseña">
              <svg id="eye-icon" width="22" height="18" viewBox="0 0 22 18" fill="none">
                <path d="M1 9s4-7.5 10-7.5S21 9 21 9s-4 7.5-10 7.5S1 9 1 9z" stroke="#d3d3d3" stroke-width="1.5"/>
                <circle cx="11" cy="9" r="3" stroke="#d3d3d3" stroke-width="1.5"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="row">
          <label class="checkbox">
            <input type="checkbox" id="remember" checked />
            <span class="checkbox__box"></span>
            Recuérdame
          </label>
          <a href="#" class="link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-primary">Continuar</button>
      </form>
    </div>

    <div class="home-indicator"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
