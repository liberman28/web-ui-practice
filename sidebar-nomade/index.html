<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidebar — Nómade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <aside class="sidebar">
    <!-- Logo -->
    <div class="logo">
      <div class="logo__mark">N</div>
      <p class="logo__name">Nómade</p>
    </div>

    <!-- Nav -->
    <nav class="nav">
      <button class="nav-item nav-item--active" data-item="dashboard">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <rect x="2" y="2" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="2"/>
          <rect x="12" y="2" width="6" height="4" rx="1.5" stroke="currentColor" stroke-width="2"/>
          <rect x="12" y="10" width="6" height="8" rx="1.5" stroke="currentColor" stroke-width="2"/>
          <rect x="2" y="12" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="2"/>
        </svg>
        <span>Dashboard</span>
      </button>

      <div class="nav-section">
        <p class="nav-section__label">Personas</p>

        <button class="nav-item" data-item="equipo">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="7" cy="6" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M1.5 17c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="14.5" cy="7" r="2.3" stroke="currentColor" stroke-width="1.6"/><path d="M13 11.7c2.3.2 4 2.2 4 4.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Equipo</span>
        </button>

        <button class="nav-item" data-item="incorporacion">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="8" cy="6" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M1.5 17.5c0-3.3 2.9-6 6.5-6s6.5 2.7 6.5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M16 6.5v4M14 8.5h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Incorporación</span>
        </button>

        <button class="nav-item" data-item="tiempo-libre">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="3.5" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M2 7.5h16M6 2v3M14 2v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Tiempo libre</span>
        </button>

        <button class="nav-item" data-item="control-horario">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.6"/><path d="M10 5.5V10l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Control horario</span>
        </button>

        <button class="nav-item" data-item="incentivos">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 17s-7-4.2-7-9.3C3 4.8 5 3 7.4 3c1.1 0 2.1.5 2.6 1.4C10.5 3.5 11.5 3 12.6 3 15 3 17 4.8 17 7.7 17 12.8 10 17 10 17z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <span>Incentivos</span>
        </button>

        <button class="nav-item" data-item="gastos">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.6"/><path d="M12.7 7.8c-.3-.9-1.3-1.4-2.6-1.4-1.5 0-2.7.8-2.7 2s1.2 1.6 2.7 1.8c1.6.2 2.7.7 2.7 1.9s-1.2 1.9-2.7 1.9c-1.4 0-2.4-.5-2.7-1.4M10 5.3v9.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span>Gastos</span>
        </button>

        <button class="nav-item" data-item="calculadora">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3.5" y="2" width="13" height="16" rx="1.6" stroke="currentColor" stroke-width="1.6"/><path d="M6 5.5h8M6.5 9.5h1.2M9.4 9.5h1.2M12.3 9.5h1.2M6.5 12.5h1.2M9.4 12.5h1.2M12.3 12.5h1.2M6.5 15.2h1.2M9.4 15.2h1.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span>Calculadora</span>
        </button>

        <button class="nav-item" data-item="compensacion">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2l1.6 4.9L17 7l-4 3.4 1.4 5.1L10 12.7 5.6 15.5 7 10.4 3 7l5.4-.1L10 2z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span>Compensación</span>
        </button>

        <button class="nav-item" data-item="solicitudes">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 2.5h7l3.5 3.5V17a.5.5 0 01-.5.5H5a.5.5 0 01-.5-.5V3a.5.5 0 01.5-.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M6.5 9.5h6M6.5 12.5h6M6.5 6.5h2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span>Solicitudes</span>
        </button>

        <button class="nav-item nav-item--split" data-item="feedback">
          <span class="nav-item__left">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 17s-7-4.2-7-9.3C3 4.8 5 3 7.4 3c1.1 0 2.1.5 2.6 1.4C10.5 3.5 11.5 3 12.6 3 15 3 17 4.8 17 7.7 17 12.8 10 17 10 17z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            <span>Feedback</span>
          </span>
          <span class="badge">Beta</span>
        </button>
      </div>

      <div class="nav-section">
        <p class="nav-section__label">Pagos</p>

        <button class="nav-item" data-item="nomina">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.6"/><path d="M10 6v8M12.5 8.2c0-1-.9-1.7-2.2-1.7-1.4 0-2.5.7-2.5 1.8 0 1.1 1.1 1.4 2.5 1.7 1.5.3 2.5.7 2.5 1.9s-1.1 1.9-2.5 1.9c-1.3 0-2.2-.7-2.2-1.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <span>Nómina</span>
        </button>

        <button class="nav-item" data-item="facturas">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="4" width="16" height="12" rx="1.8" stroke="currentColor" stroke-width="1.6"/><path d="M2.5 5.5L10 11l7.5-5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Facturas</span>
        </button>

        <button class="nav-item" data-item="utilidad">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="14" height="14" rx="2.2" stroke="currentColor" stroke-width="1.6"/><path d="M10 6.5v7M12.3 8.5c0-.9-.9-1.5-2.1-1.5-1.3 0-2.3.7-2.3 1.6s1 1.3 2.3 1.5c1.4.3 2.3.7 2.3 1.7S9.2 13.5 8 13.5c-1.2 0-2.1-.6-2.3-1.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span>Utilidad</span>
        </button>
      </div>
    </nav>

    <!-- Profile -->
    <div class="profile">
      <div class="profile__avatar">LG</div>
      <div class="profile__info">
        <p class="profile__name">Liberman Gonzalez</p>
        <p class="profile__role">Web Designer</p>
      </div>
    </div>
  </aside>

  <script src="script.js"></script>
</body>
</html>
